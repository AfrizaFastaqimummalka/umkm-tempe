services:
  - type: web
    name: umkm-tempe-api
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        value: YOUR_SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        value: postgresql://USER:PASSWORD@HOST/DBNAME?sslmode=require
      - key: ALLOWED_HOSTS
        value: umkm-tempe-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://umkm-tempe.vercel.app
      - key: TELEGRAM_BOT_TOKEN
        value: 8742618068:AAEDV31b9C5cQ6LYSu0huhEa5JdwLSXkPxE
      - key: TELEGRAM_ALLOWED_CHAT_IDS
        value: 6809044848